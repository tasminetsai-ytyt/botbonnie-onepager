<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BotBonnie One-Pager Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:'Open Sans','Noto Sans TC',sans-serif;background:#f4f3f8;color:#1a1830;min-height:100vh}
#root{min-height:100vh}

/* ── PASSWORD GATE ── */
.gate-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#f0eeff 0%,#f8f7ff 50%,#eef3ff 100%)}
.gate-card{background:#fff;border:1.5px solid #e2dff5;border-radius:18px;padding:44px 40px 36px;width:360px;box-shadow:0 8px 40px rgba(91,79,255,.09);text-align:center}
.gate-logo{width:52px;height:52px;background:linear-gradient(135deg,#296AFF,#0321AA);border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Open Sans',sans-serif;font-size:24px;font-weight:700;color:#fff;margin:0 auto 18px}
.gate-title{font-family:'Open Sans',sans-serif;font-size:20px;font-weight:700;color:#1a1830;margin-bottom:5px}
.gate-sub{font-size:13px;color:#9490b8;margin-bottom:28px;line-height:1.5}
.gate-field{position:relative;margin-bottom:14px}
.gate-field input{width:100%;background:#faf9ff;border:1.5px solid #e2dff5;border-radius:10px;color:#1a1830;font-family:'Open Sans','Noto Sans TC',sans-serif;font-size:14px;padding:12px 42px 12px 14px;outline:none;transition:border-color .15s;text-align:center;letter-spacing:2px}
.gate-field input:focus{border-color:#296AFF;background:#fff}
.gate-field input.err-shake{border-color:#f05454;animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.gate-toggle{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#b0acc8;font-size:15px;padding:4px}
.gate-btn{width:100%;padding:12px;background:linear-gradient(135deg,#296AFF,#0321AA);border:none;border-radius:10px;color:#fff;font-family:'Open Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;margin-top:4px}
.gate-btn:hover{opacity:.9}
.gate-btn:active{transform:scale(.98)}
.gate-err{font-size:12px;color:#f05454;margin-top:8px;min-height:18px}
.gate-footer{font-size:11px;color:#c4c0e0;margin-top:20px}

/* ── LAYOUT ── */
.app{display:grid;grid-template-columns:460px 1fr;min-height:100vh}

/* ── LEFT PANEL ── */
.left{background:#fff;border-right:1.5px solid #e8e5f5;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:hidden}
.left-header{padding:22px 24px 16px;border-bottom:1px solid #e8eeff;flex-shrink:0}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.logo-box{width:34px;height:34px;background:linear-gradient(135deg,#296AFF,#0321AA);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Open Sans',sans-serif;font-size:16px;font-weight:700;color:#fff}
.logo-name{font-family:'Open Sans',sans-serif;font-size:17px;font-weight:700;color:#1a1830;letter-spacing:-0.3px}
.logo-tag{font-size:10px;background:#e8eeff;color:#296AFF;border-radius:20px;padding:2px 8px;font-weight:600}
.left-sub{font-size:12px;color:#9490b8;line-height:1.5}

.steps-bar{display:flex;gap:0;padding:0 24px;background:#faf9ff;border-bottom:1px solid #e8eeff;flex-shrink:0}
.step-tab{flex:1;padding:10px 4px;font-size:11px;font-weight:600;color:#b0acc8;border-bottom:2.5px solid transparent;cursor:pointer;text-align:center;transition:all .2s;letter-spacing:.3px}
.step-tab.active{color:#296AFF;border-bottom-color:#296AFF}
.step-tab.done{color:#296AFF}

.left-body{flex:1;overflow-y:auto;padding:20px 24px 24px}

/* ── FORM ELEMENTS ── */
.field-group{margin-bottom:14px}
.field-label{font-size:12px;font-weight:600;color:#5a567a;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.field-label .req{color:#f05454;font-size:10px}
.field-label .hint{font-size:10px;color:#b0acc8;font-weight:400}
input[type=text],textarea,select{width:100%;background:#faf9ff;border:1.5px solid #e2dff5;border-radius:9px;color:#1a1830;font-family:'Open Sans','Noto Sans TC',sans-serif;font-size:13.5px;padding:9px 12px;outline:none;transition:border-color .15s}
input[type=text]:focus,textarea:focus,select:focus{border-color:#296AFF;background:#fff}
textarea{resize:vertical;line-height:1.65;min-height:80px}
select{cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.section-head{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#c4c0e0;margin:18px 0 10px}

/* ── BADGE TOGGLES ── */
.badge-group{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.btog{font-size:12px;padding:5px 11px;border-radius:20px;border:1.5px solid #e2dff5;background:#faf9ff;color:#7a78a0;cursor:pointer;transition:all .15s;font-family:'Open Sans','Noto Sans TC',sans-serif;font-weight:500}
.btog:hover{border-color:#5E8FFF;color:#296AFF}
.btog.on{background:#e8eeff;border-color:#296AFF;color:#296AFF;font-weight:600}

/* kit groups */
.kit-group{margin-bottom:10px}
.kit-group-label{font-size:11px;font-weight:600;color:#9490b8;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.kit-group-label::after{content:'';flex:1;height:1px;background:#e8eeff}
.custom-kit-input{margin-top:8px}
.chip-wrap{display:flex;flex-wrap:wrap;gap:5px;min-height:30px;border:1.5px solid #e2dff5;border-radius:9px;padding:6px 8px;background:#faf9ff;cursor:text;transition:border-color .15s}
.chip-wrap:focus-within{border-color:#296AFF;background:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;background:#e8eeff;color:#296AFF;border-radius:14px;padding:3px 9px;font-size:12px;font-weight:600}
.chip-x{cursor:pointer;font-size:11px;color:#a89cf7;line-height:1}
.chip-wrap input{border:none;background:transparent;outline:none;font-size:13px;font-family:'Open Sans','Noto Sans TC',sans-serif;color:#1a1830;min-width:120px;padding:2px 4px}

/* upload */
.upload-zone{border:2px dashed #d8d4f0;border-radius:11px;padding:16px;text-align:center;cursor:pointer;transition:all .15s;background:#fdfcff}
.upload-zone:hover{border-color:#296AFF;background:#f5f3ff}
.upload-zone.has-files{border-color:#5E8FFF;background:#f5f3ff}
.upload-label{font-size:12px;color:#9490b8;line-height:1.6}
.upload-thumb-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:flex-start}
.upload-thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1.5px solid #e2dff5}
.upload-thumb img{width:100%;height:100%;object-fit:cover}
.upload-thumb .rm{position:absolute;top:3px;right:3px;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;color:#5a567a;display:flex;align-items:center;justify-content:center;line-height:1}
.logo-preview{width:80px;height:50px;object-fit:contain;border-radius:6px;border:1.5px solid #e2dff5;background:#fff;padding:4px}

/* radio like */
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-opt{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid #e2dff5;border-radius:9px;cursor:pointer;font-size:13px;color:#5a567a;background:#faf9ff;transition:all .15s;font-weight:500}
.radio-opt:hover{border-color:#5E8FFF}
.radio-opt.sel{border-color:#296AFF;background:#e8eeff;color:#296AFF;font-weight:600}
.radio-opt input{display:none}

/* nav buttons */
.nav-row{display:flex;gap:8px;margin-top:18px}
.btn-back{flex:0 0 auto;padding:10px 16px;border:1.5px solid #e2dff5;border-radius:9px;background:#fff;color:#9490b8;font-size:13px;font-weight:600;cursor:pointer;font-family:'Open Sans','Noto Sans TC',sans-serif;transition:all .15s}
.btn-back:hover{border-color:#5E8FFF;color:#296AFF}
.btn-next{flex:1;padding:11px;background:linear-gradient(135deg,#296AFF,#0321AA);border:none;border-radius:9px;color:#fff;font-family:'Open Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.2px;transition:opacity .15s,transform .1s}
.btn-next:hover{opacity:.9}
.btn-next:active{transform:scale(.98)}
.btn-next:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{flex:1;padding:10px;border:1.5px solid #296AFF;border-radius:9px;background:#fff;color:#296AFF;font-family:'Open Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:#e8eeff}

/* spinner */
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rotate .7s linear infinite;vertical-align:middle;margin-right:7px}
@keyframes rotate{to{transform:rotate(360deg)}}

/* error */
.err{background:#fff2f2;border:1.5px solid #fca5a5;border-radius:8px;padding:10px 14px;color:#dc2626;font-size:13px;margin-top:12px;line-height:1.55}

/* progress indicator */
.progress{display:flex;gap:4px;padding:0 24px 14px;flex-shrink:0}
.prog-dot{flex:1;height:3px;border-radius:2px;background:#e2dff5;transition:background .3s}
.prog-dot.done{background:#296AFF}
.prog-dot.active{background:#296AFF}

/* ── RIGHT PANEL ── */
.right{padding:32px 36px;overflow-y:auto;background:#f4f3f8}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;gap:14px}
.empty-icon{font-size:52px;opacity:.18;color:#296AFF}
.empty-state h2{font-size:18px;color:#6e6a90;font-weight:600}
.empty-state p{font-size:13px;color:#b0acc8;line-height:1.65;max-width:300px}

/* ── PREVIEW ── */
.preview-wrap{animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.preview-actions{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.pa-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Open Sans','Noto Sans TC',sans-serif;border:1.5px solid #e2dff5;background:#fff;color:#5a567a;transition:all .15s}
.pa-btn:hover{border-color:#296AFF;color:#296AFF}
.pa-btn.primary{background:linear-gradient(135deg,#296AFF,#0321AA);color:#fff;border:none}
.pa-btn.primary:hover{opacity:.9}
.pa-btn.success{background:#ecfdf5;color:#059669;border-color:#6ee7b7}

/* ── SLIDE CANVAS ── */
.slide-canvas{background:#fff;border-radius:14px;border:1.5px solid #e2dff5;overflow:hidden;box-shadow:0 4px 24px rgba(91,79,255,.07)}

/* top strip */
.slide-top{background:#1A234E;padding:18px 28px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.slide-brand{display:flex;align-items:center;gap:12px}
.slide-logo-box{width:56px;height:36px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.slide-logo-box img{max-width:100%;max-height:100%;object-fit:contain}
.slide-logo-empty{width:56px;height:36px;border-radius:7px;border:1.5px dashed rgba(255,255,255,.35);flex-shrink:0}
.slide-goals{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.slide-goal-chip{font-size:11px;padding:3px 10px;border-radius:4px;font-weight:700;letter-spacing:.2px}
.gc-blue{background:#dbeafe;color:#1d4ed8}
.gc-green{background:#dcfce7;color:#15803d}
.gc-amber{background:#fef9c3;color:#a16207}
.gc-teal{background:#ccfbf1;color:#0f766e}
.gc-pink{background:#fce7f3;color:#9d174d}
.gc-purple{background:#e8eeff;color:#296AFF}

.slide-titles{padding:22px 28px 18px;border-bottom:1px solid #f0eeff}
.slide-headline{font-size:19px;font-weight:900;color:#1a1830;line-height:1.3;letter-spacing:-.3px;margin-bottom:6px}
.slide-headline[contenteditable]{outline:none;border-radius:4px;padding:2px 4px;margin:-2px -4px}
.slide-headline[contenteditable]:focus{background:#f5f3ff;box-shadow:0 0 0 2px #a89cf7}
.slide-subtitle{font-size:13px;color:#8784a8;line-height:1.6}
.slide-subtitle[contenteditable]{outline:none;border-radius:4px;padding:2px 4px;margin:-2px -4px}
.slide-subtitle[contenteditable]:focus{background:#f5f3ff;box-shadow:0 0 0 2px #a89cf7}

/* four columns */
.slide-cols{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #f0eeff}
.slide-col{padding:16px 18px;border-right:1px solid #f0eeff;position:relative}
.slide-col:last-child{border-right:none}
.col-num{font-size:9px;background:#e8eeff;color:#296AFF;border-radius:3px;padding:1px 5px;font-weight:700;margin-bottom:7px;display:inline-block}
.col-head{font-size:9.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#b0acc8;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid #f0eeff}
.col-title{font-size:12.5px;font-weight:700;color:#2d2b4e;margin-bottom:6px;line-height:1.35}
.col-title[contenteditable]{outline:none;border-radius:4px;padding:2px 4px;margin:-2px -4px}
.col-title[contenteditable]:focus{background:#f5f3ff;box-shadow:0 0 0 2px #a89cf7}
.col-body{font-size:11.5px;color:#6e6a90;line-height:1.7}
.col-body[contenteditable]{outline:none;border-radius:4px;padding:2px 4px;margin:-2px -4px}
.col-body[contenteditable]:focus{background:#f5f3ff;box-shadow:0 0 0 2px #a89cf7}
.edit-hint{font-size:10px;color:#d0cce8;margin-top:6px;font-style:italic;display:none}
.slide-col:hover .edit-hint{display:block}

/* screenshots area */
.slide-screens{padding:16px 28px;display:flex;gap:10px;background:#faf9ff;border-bottom:1px solid #f0eeff;flex-wrap:wrap}
.screen-img{border-radius:12px;overflow:hidden;border:1.5px solid #e2dff5;height:130px;flex:1;min-width:100px;max-width:200px}
.screen-img img{width:100%;height:100%;object-fit:cover}
.screen-placeholder{height:130px;flex:1;min-width:100px;max-width:200px;border-radius:12px;border:2px dashed #e2dff5;background:#f4f3f8;display:flex;align-items:center;justify-content:center;font-size:11px;color:#c4c0e0}

/* metrics */
.slide-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding:16px 28px;border-bottom:1px solid #f0eeff}
.metric-card{background:#faf9ff;border:1.5px solid #e8eeff;border-radius:10px;padding:14px 12px;text-align:center}
.metric-val{font-family:'Open Sans',sans-serif;font-size:26px;font-weight:700;color:#296AFF;line-height:1;margin-bottom:5px}
.metric-val[contenteditable]{outline:none;border-radius:4px}
.metric-val[contenteditable]:focus{background:#f5f3ff}
.metric-lbl{font-size:11px;color:#9490b8;line-height:1.4}
.metric-lbl[contenteditable]{outline:none;border-radius:4px}
.metric-lbl[contenteditable]:focus{background:#f5f3ff}
.metric-add{background:transparent;border:2px dashed #d8d4f0;border-radius:10px;padding:14px 12px;text-align:center;cursor:pointer;font-size:11px;color:#b0acc8;transition:all .15s}
.metric-add:hover{border-color:#296AFF;color:#296AFF}

/* summary */
.slide-summary{padding:16px 28px}
.sum-label{font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#296AFF;margin-bottom:7px}
.sum-text{font-size:12px;color:#6e6a90;line-height:1.7}
.sum-text[contenteditable]{outline:none;border-radius:4px;padding:2px 4px;margin:-2px -4px}
.sum-text[contenteditable]:focus{background:#f5f3ff;box-shadow:0 0 0 2px #a89cf7}

/* specs footer */
.slide-specs{padding:12px 28px;background:#faf9ff;border-top:1px solid #f0eeff;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.spec-chip{font-size:11px;background:#fff;border:1px solid #e2dff5;border-radius:6px;padding:3px 9px;color:#9490b8}
.spec-chip strong{color:#5a567a;font-weight:600}
.appier-logo{margin-left:auto;font-size:10px;color:#c4c0e0;font-weight:600;font-family:'Open Sans',sans-serif}

/* goal suggestion */
.goal-suggestion-wrap{background:#fff;border:1.5px solid #e8eeff;border-radius:10px;padding:14px 16px;margin-top:16px}
.gs-label{font-size:11px;font-weight:600;color:#296AFF;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.gs-loading{font-size:12px;color:#b0acc8;font-style:italic}

/* ai loading overlay */
.ai-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:12px;color:#9490b8}
.ai-loading .big-spin{width:36px;height:36px;border:3px solid #e8eeff;border-top-color:#296AFF;border-radius:50%;animation:rotate .8s linear infinite}
.ai-loading p{font-size:13px;line-height:1.6;text-align:center;max-width:240px}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#f4f3f8}
::-webkit-scrollbar-thumb{background:#d4d0ea;border-radius:3px}

/* editable glow hint */
[contenteditable]:hover:not(:focus){background:#f8f7ff;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

/* ─── CONSTANTS ─── */
const GOAL_OPTS = [
  {label:'提升用戶互動',color:'gc-blue'},
  {label:'增加用戶活躍度',color:'gc-green'},
  {label:'增加綁定用戶',color:'gc-amber'},
  {label:'增加 LINE 用戶',color:'gc-teal'},
  {label:'增加線下導購',color:'gc-pink'},
  {label:'舊客喚回',color:'gc-amber'},
  {label:'O2O 導流',color:'gc-teal'},
  {label:'搜集用戶輪廓',color:'gc-blue'},
  {label:'增加線上互動',color:'gc-green'},
  {label:'提高會員活躍度',color:'gc-purple'},
  {label:'沉浸式互動體驗',color:'gc-purple'},
];
const GOAL_COLOR_MAP = Object.fromEntries(GOAL_OPTS.map(g=>[g.label,g.color]));
const getGoalColor = l => GOAL_COLOR_MAP[l] || 'gc-blue';

const KIT_GROUPS = [
  { group:'邏輯套件', kits:['條件分流','定時推播'] },
  { group:'進階套件', kits:['帳號綁定','問卷調查','輪盤抽獎','盲盒','刮刮樂','角色人物','發票登錄','集點卡','MGM','每日簽到','獎項發放','序號驗證','隨機回覆'] },
  { group:'其他', kits:['參數儲存','標籤儲存','圖文訊息','Rich Menu','導流工具','旅程圖'] },
];

/* ─── HELPERS ─── */
const GEMINI_API_KEY = 'AIzaSyB_JDRpOmfjrlOKGaZ7WILIkfOOb1ltkzY'; // 換成你的 Google AI Studio Key
async function callClaude(prompt){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
  const r = await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{parts:[{text:prompt}]}],
      generationConfig:{temperature:0.7,maxOutputTokens:3000}
    })
  });
  const d = await r.json();
  if(d.error) throw new Error(d.error.message);
  const txt = d.candidates?.[0]?.content?.parts?.[0]?.text || '';
  // Find first { and last } to extract JSON regardless of surrounding text
  const first = txt.indexOf('{');
  const last = txt.lastIndexOf('}');
  if(first === -1 || last === -1) throw new Error('No JSON in response: ' + txt.substring(0,150));
  return txt.substring(first, last+1);
}

function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

/* ─── CHIP INPUT ─── */
function ChipInput({chips,onChange,placeholder}){
  const [val,setVal]=useState('');
  const add=()=>{
    const parts=val.split(/[,，\n]/).map(s=>s.trim()).filter(Boolean);
    if(parts.length){onChange([...chips,...parts.filter(p=>!chips.includes(p))]);setVal('')}
  };
  const onKey=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
  return(
    <div className="chip-wrap" onClick={e=>e.currentTarget.querySelector('input').focus()}>
      {chips.map(c=>(
        <span key={c} className="chip">{c}<span className="chip-x" onClick={()=>onChange(chips.filter(x=>x!==c))}>✕</span></span>
      ))}
      <input value={val} onChange={e=>setVal(e.target.value)} onKeyDown={onKey} onBlur={add} placeholder={chips.length?'':placeholder}/>
    </div>
  );
}

function Editable({tag:Tag='span',className,value,onChange}){
  const ref=useRef();
  useEffect(()=>{if(ref.current&&ref.current.innerText!==value)ref.current.innerText=value},[value]);
  return(
    <Tag
      ref={ref}
      className={className}
      contentEditable
      suppressContentEditableWarning
      onBlur={()=>onChange&&onChange(ref.current.innerText)}
    />
  );
}

/* ─── PASSWORD GATE ─── */
const CORRECT_PW = 'appiercsm';

function PasswordGate({onUnlock}){
  const [pw,setPw]=useState('');
  const [show,setShow]=useState(false);
  const [err,setErr]=useState('');
  const [shake,setShake]=useState(false);

  const attempt=()=>{
    if(pw===CORRECT_PW){
      sessionStorage.setItem('bb_auth','1');
      onUnlock();
    }else{
      setErr('密碼錯誤，請再試一次');
      setShake(true);
      setTimeout(()=>setShake(false),400);
      setPw('');
    }
  };
  const onKey=e=>{if(e.key==='Enter')attempt()};

  return(
    <div className="gate-wrap">
      <div className="gate-card">
        <div className="gate-logo">B</div>
        <div className="gate-title">BotBonnie One-Pager AI</div>
        <div className="gate-sub">Appier CSM 內部工具<br/>請輸入存取密碼以繼續</div>
        <div className="gate-field">
          <input
            type={show?'text':'password'}
            value={pw}
            onChange={e=>{setPw(e.target.value);setErr('')}}
            onKeyDown={onKey}
            placeholder="輸入密碼"
            className={shake?'err-shake':''}
            autoFocus
          />
          <button className="gate-toggle" onClick={()=>setShow(s=>!s)} tabIndex={-1}>
            {show?'🙈':'👁'}
          </button>
        </div>
        <div className="gate-err">{err}</div>
        <button className="gate-btn" onClick={attempt}>進入工具 →</button>
        <div className="gate-footer">© Appier Group · 僅供內部使用</div>
      </div>
    </div>
  );
}

根據以下案例資訊，生成 One-Pager 文案。只輸出純 JSON，不要任何說明或 markdown。

      slide.background = { color: C.WHITE };

      // ════════════════════════════════
      // 1. GOAL BADGES (top left)  y=0.07
      // ════════════════════════════════
      const goals = result.goal_badges || [];
      let gx = 0.145;
      goals.slice(0,4).forEach(g => {
        const gw = Math.min(g.length * 0.135 + 0.2, 1.8);
        slide.addShape(pres.shapes.RECTANGLE,{x:gx,y:0.07,w:gw,h:0.246,fill:{color:C.PRODUCT_BLUE},line:{color:C.PRODUCT_BLUE}});
        slide.addText(g,{x:gx,y:0.07,w:gw,h:0.246,fontSize:9,bold:true,color:C.WHITE,align:'center',valign:'middle',margin:0,fontFace:'Noto Sans TC'});
        gx += gw + 0.12;
      });

      // ════════════════════════════════
      // 2. SPEC BOX (top right) — 方案/套件/客製化
      // ════════════════════════════════
      slide.addShape(pres.shapes.RECTANGLE,{x:8.539,y:0.07,w:1.398,h:0.606,fill:{color:C.LIGHT_BLUE},line:{color:C.LIGHT_BLUE}});
      slide.addText(
        `1. 方案：${planLabel}\n2. 行銷套件：${allKits||'—'}\n3. 客製化：${customLabel}`,
        {x:8.56,y:0.08,w:1.36,h:0.58,fontSize:7,color:C.NAVY,align:'left',valign:'top',margin:3,fontFace:'Noto Sans TC',wrap:true}
      );

      // ════════════════════════════════
      // 3. BRAND COLOR BLOCK + LOGO (left of headline)
      // ════════════════════════════════
      // Orange brand block
      slide.addShape(pres.shapes.RECTANGLE,{x:0.248,y:0.384,w:0.825,h:0.677,fill:{color:C.ORANGE},line:{color:C.ORANGE}});
      // Logo inside brand block
      if(formData.logoPreview){
        slide.addImage({data:formData.logoPreview,x:0.26,y:0.39,w:0.8,h:0.65,sizing:{type:'contain',w:0.8,h:0.65}});
      } else {
        slide.addText(formData.brand.substring(0,4),{x:0.248,y:0.384,w:0.825,h:0.677,fontSize:8,bold:true,color:C.WHITE,align:'center',valign:'middle',margin:0,fontFace:'Noto Sans TC'});
      }

      // ════════════════════════════════
      // 4. HEADLINE (blue bg, white text)
      // ════════════════════════════════
      slide.addShape(pres.shapes.RECTANGLE,{x:1.09,y:0.329,w:7.497,h:0.677,fill:{color:C.NAVY},line:{color:C.NAVY}});
      slide.addText(result.headline,{x:1.13,y:0.335,w:7.38,h:0.665,fontSize:14,bold:false,color:C.WHITE,align:'left',valign:'middle',margin:4,fontFace:'Noto Sans TC',wrap:true});

      // ════════════════════════════════
      // 5. SUBTITLE (below headline, white bg)
      // ════════════════════════════════
      slide.addText(result.subtitle,{x:1.13,y:1.01,w:7.38,h:0.26,fontSize:11,color:C.BLACK,align:'left',valign:'middle',margin:0,fontFace:'Noto Sans TC'});

      // ════════════════════════════════
      // 6. VERTICAL DECORATIVE BARS (4 columns)
      // ════════════════════════════════
      // Each col bar: thin vertical stripe at col left edge
      const barColors = [C.MID_BLUE, C.PALE_BLUE, C.MID_BLUE, C.PALE_BLUE];
      const barXs = [0.128, 1.285, 2.57, 4.952]; // rough col starts
      // Actually from XML: x=1.285,2.57(~2.668),4.952,7.467 for the 4 col text boxes
      // Vertical bars at x=0.128,1.284,3.301,5.733,7.885
      [
        {x:0.128,  color:C.MID_BLUE},
        {x:1.284,  color:C.MID_BLUE},
        {x:3.301,  color:C.PALE_BLUE},
        {x:5.733,  color:C.MID_BLUE},
        {x:7.885,  color:C.PALE_BLUE},
      ].forEach(b=>{
        slide.addShape(pres.shapes.RECTANGLE,{x:b.x,y:0.061,w:0.507,h:2.82,fill:{color:b.color},line:{color:b.color}});
      });

      // ════════════════════════════════
      // 7. COLUMN HEADERS (blue bg, white text, 4 cols)
      // ════════════════════════════════
      const cols = [
        {label:'接觸點',     x:0.356, w:1.856, title:result.touchpoint_title,  body:result.touchpoint_body},
        {label:'互動與體驗', x:2.668, w:2.256, title:result.interaction_title, body:result.interaction_body},
        {label:'強化完成誘因',x:5.373, w:1.66,  title:result.incentive_title,   body:result.incentive_body},
        {label:'目標與成效', x:7.771, w:1.988, title:result.outcome_title,     body:result.outcome_body},
      ];
      const hdrY=1.14, hdrH=0.303;
      cols.forEach(col=>{
        slide.addShape(pres.shapes.RECTANGLE,{x:col.x,y:hdrY,w:col.w,h:hdrH,fill:{color:C.NAVY},line:{color:C.NAVY}});
        slide.addText(col.label,{x:col.x,y:hdrY,w:col.w,h:hdrH,fontSize:12,bold:true,color:C.WHITE,align:'center',valign:'middle',margin:0,fontFace:'Noto Sans TC'});
      });

      // ════════════════════════════════
      // 8. COLUMN CONTENT (title bold + body)
      // ════════════════════════════════
      const contentY = 1.434;
      cols.forEach(col=>{
        // Title (bold)
        slide.addText(col.title,{x:col.x,y:contentY,w:col.w,h:0.22,fontSize:8,bold:true,color:C.BLACK,align:'left',valign:'top',margin:0,fontFace:'Noto Sans TC',wrap:true});
        // Body
        slide.addText(col.body,{x:col.x,y:contentY+0.22,w:col.w,h:0.95,fontSize:8,bold:false,color:C.BLACK,align:'left',valign:'top',margin:0,fontFace:'Noto Sans TC',wrap:true});
      });

      // ════════════════════════════════
      // 9. SCREENSHOTS (3 images, below columns)
      // ════════════════════════════════
      const screens = formData.screenshots || [];
      const imgY = 2.5, imgH = 1.6;
      const imgCount = Math.min(screens.length, 3);
      if(imgCount > 0){
        const totalW = 7.45;
        const imgW = (totalW - (imgCount-1)*0.15) / imgCount;
        screens.slice(0,3).forEach((s,i)=>{
          slide.addImage({
            data:s,
            x:0.128+i*(imgW+0.15),
            y:imgY,
            w:imgW,
            h:imgH,
          });
        });
      }

      // ════════════════════════════════
      // 10. METRIC CARDS (right column, dark blue bg)
      // ════════════════════════════════
      const metrics = result.metrics || [];
      const mX=7.505, mW=2.186, mH=0.769, mGap=0.072;
      metrics.slice(0,3).forEach((m,i)=>{
        const my = 2.908 + i*(mH+mGap);
        slide.addShape(pres.shapes.ROUNDED_RECTANGLE,{x:mX,y:my,w:mW,h:mH,fill:{color:C.NAVY},line:{color:C.NAVY},rectRadius:0.12});
        // Big number (left)
        slide.addText(m.value,{x:mX+0.08,y:my+0.04,w:1.2,h:mH-0.08,fontSize:22,bold:true,color:C.WHITE,align:'left',valign:'middle',margin:0,fontFace:'Noto Sans TC'});
        // Label (right)
        slide.addText(m.label,{x:mX+1.05,y:my+0.1,w:mW-1.1,h:mH-0.2,fontSize:12,bold:true,color:C.WHITE,align:'left',valign:'middle',margin:0,fontFace:'Noto Sans TC',wrap:true});
      });

      // Data note
      if(formData.period){
        slide.addShape(pres.shapes.RECTANGLE,{x:mX,y:4.594,w:mW+0.125,h:0.498,fill:{color:C.NAVY},line:{color:C.NAVY}});
        slide.addText(`* 活動數據來自 ${formData.period}`,{x:mX+0.05,y:4.61,w:mW+0.07,h:0.47,fontSize:8,color:C.WHITE,align:'left',valign:'top',margin:2,fontFace:'Noto Sans TC',wrap:true});
      }

      // ════════════════════════════════
      // 11. FOOTER
      // ════════════════════════════════
      slide.addText('©Appier Group, Inc. (along with its subsidiaries) All rights reserved.',
        {x:2.5,y:5.38,w:5,h:0.2,fontSize:7,color:'888888',align:'center',margin:0,fontFace:'Noto Sans TC'});
      // Appier logo text
      slide.addText('Appier',{x:0.13,y:5.32,w:1.2,h:0.26,fontSize:14,bold:true,color:C.NAVY,align:'left',valign:'middle',margin:0,fontFace:'Georgia'});

      // ── DOWNLOAD ──
      const fname=`BotBonnie_CaseStudy_${formData.brand.replace(/\s/g,'_')}_${Date.now()}.pptx`;
      await pres.writeFile({fileName:fname});
      setExportDone(true);
    }catch(e){
      setError('PPTX 產生失敗：'+e.message);
    }finally{setExportLoading(false)}
  };

  const STEPS=['基本資訊','行銷套件','活動描述','活動目標','預覽'];

  return(
    <div className="app">
      {/* LEFT */}
      <div className="left">
        <div className="left-header">
          <div className="logo-row">
            <div className="logo-box">B</div>
            <span className="logo-name">BotBonnie</span>
            <span className="logo-tag">One-Pager AI</span>
          </div>
          <div className="left-sub">CSM 案例文案產生器 · Appier</div>
        </div>

        {/* Step tabs */}
        <div className="steps-bar">
          {STEPS.map((s,i)=>(
            <div key={s} className={`step-tab${step===i+1?' active':step>i+1?' done':''}`} onClick={()=>step>i+1&&setStep(i+1)}>{s}</div>
          ))}
        </div>
        <div className="progress">
          {STEPS.map((_,i)=>(
            <div key={i} className={`prog-dot${step>i+1?' done':step===i+1?' active':''}`}/>
          ))}
        </div>

        <div className="left-body">
          {step===1&&<Step1 data={formData} onChange={setFormData} onNext={()=>setStep(2)}/>}
          {step===2&&<Step2 data={formData} onChange={setFormData} onNext={()=>setStep(3)} onBack={()=>setStep(1)}/>}
          {step===3&&<Step3 data={formData} onChange={setFormData} onGenerate={generate} onBack={()=>setStep(2)} loading={loading}/>}
          {step===4&&<Step4 data={formData} onChange={setFormData} onNext={()=>setStep(5)} onBack={()=>setStep(3)} suggestedGoals={suggestedGoals} goalsLoading={goalsLoading}/>}
          {step===5&&<div style={{padding:'12px 0'}}>
            <div style={{fontSize:13,color:'#9490b8',lineHeight:1.7,marginBottom:16}}>預覽模式：點擊右側任意文字欄位即可直接修改。</div>
            <button className="btn-secondary" style={{width:'100%',marginBottom:8}} onClick={()=>setStep(4)}>← 修改目標</button>
            <button className="btn-secondary" style={{width:'100%',marginBottom:8}} onClick={()=>{setResult(null);setStep(3)}}>↺ 重新生成文案</button>
            {error&&<div className="err">{error}</div>}
          </div>}
          {error&&step!==5&&<div className="err">{error}</div>}
        </div>
      </div>

      {/* RIGHT */}
      <div className="right">
        {!result||step<5?(
          <div className="empty-state">
            {loading?(
              <div className="ai-loading">
                <div className="big-spin"></div>
                <p>AI 正在分析活動內容<br/>拆解四欄文案與數據亮點…</p>
              </div>
            ):(
              <>
                <div className="empty-icon">◈</div>
                <h2>One-Pager 預覽區</h2>
                <p>完成左側表單並點擊「AI 生成文案」，即可在此預覽可編輯的 One-Pager。</p>
              </>
            )}
          </div>
        ):(
          <Preview
            data={formData}
            result={result}
            setResult={setResult}
            onBack={()=>setStep(4)}
            onExport={exportSlides}
            exportLoading={exportLoading}
            exportDone={exportDone}
          />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
